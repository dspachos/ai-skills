<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-label="The visual-review workflow: a change goes to an agent review, the findings open on a local page, you comment on each finding, and the agent acts on your comments. Nothing posts to GitHub until you approve it.">
  <title>The /visual-review workflow</title>
  <defs>
    <style>
      .vr-box { fill: var(--color-card, #ffffff); stroke: var(--color-line, rgba(20,22,26,.1)); }
      .vr-note { fill: var(--color-muted, #f5f6f8); stroke: var(--color-line-strong, rgba(20,22,26,.14)); stroke-dasharray: 4 3; }
      .vr-chip { fill: var(--color-accent-panel, #ecedef); stroke: var(--color-line, rgba(20,22,26,.1)); }
      .vr-title { fill: var(--color-foreground, #14161a); font: 700 15px 'DM Sans', ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.01em; }
      .vr-desc { fill: var(--color-fg-muted, rgba(20,22,26,.7)); font: 400 12.5px 'DM Sans', ui-sans-serif, system-ui, sans-serif; }
      .vr-num { fill: var(--color-fg-faint, rgba(20,22,26,.35)); font: 500 11px 'JetBrains Mono', ui-monospace, Menlo, monospace; letter-spacing: .06em; }
      .vr-icn { fill: none; stroke: var(--color-foreground, #14161a); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .dark .vr-icn { stroke: var(--color-accent-fill, #f5c451); }
      .vr-arrow { stroke: var(--color-fg-faint, rgba(20,22,26,.35)); stroke-width: 1.5; }
      .vr-head { fill: var(--color-fg-faint, rgba(20,22,26,.35)); }
      .vr-mock { fill: var(--color-muted, #f5f6f8); stroke: var(--color-line-soft, rgba(20,22,26,.07)); }
      .vr-sep { stroke: var(--color-line-soft, rgba(20,22,26,.07)); }
      .vr-dot { fill: var(--color-fg-faint, rgba(20,22,26,.35)); }
      .vr-stub { fill: var(--color-line-strong, rgba(20,22,26,.14)); }
      .vr-pill { fill: var(--color-accent-fill, #f5c451); opacity: .4; }
      .vr-comment { fill: none; stroke: var(--color-accent-line, rgba(20,22,26,.22)); }
      .vr-caret { stroke: var(--color-accent-fill, #f5c451); stroke-width: 1.5; stroke-linecap: round; }
    </style>
  </defs>

  <!-- arrows: 01-02 right, 02-03 down, 03-04 left, 04-05 down -->
  <line class="vr-arrow" x1="406" y1="80" x2="444" y2="80"/>
  <polygon class="vr-head" points="444,73.5 456,80 444,86.5"/>
  <line class="vr-arrow" x1="670" y1="146" x2="670" y2="174"/>
  <polygon class="vr-head" points="663.5,172 670,184 676.5,172"/>
  <line class="vr-arrow" x1="474" y1="250" x2="436" y2="250"/>
  <polygon class="vr-head" points="432,243.5 420,250 432,256.5"/>
  <line class="vr-arrow" x1="210" y1="316" x2="210" y2="344"/>
  <polygon class="vr-head" points="203.5,342 210,354 216.5,342"/>

  <!-- 01 the change -->
  <rect class="vr-box" x="20" y="20" width="380" height="120" rx="12"/>
  <rect class="vr-chip" x="36" y="36" width="36" height="36" rx="8"/>
  <g class="vr-icn" transform="translate(44, 44) scale(0.8333)">
    <line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>
  </g>
  <text class="vr-num" x="384" y="50" text-anchor="end">01</text>
  <text class="vr-title" x="36" y="96">The change</text>
  <text class="vr-desc" x="36" y="116">A PR, a commit, two branches,</text>
  <text class="vr-desc" x="36" y="132">or uncommitted work.</text>

  <!-- 02 agent review -->
  <rect class="vr-box" x="480" y="20" width="380" height="120" rx="12"/>
  <rect class="vr-chip" x="496" y="36" width="36" height="36" rx="8"/>
  <g class="vr-icn" transform="translate(504, 44) scale(0.8333)">
    <path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"/>
  </g>
  <text class="vr-num" x="844" y="50" text-anchor="end">02</text>
  <text class="vr-title" x="496" y="96">Agent review</text>
  <text class="vr-desc" x="496" y="116">Reads the diff and checks each</text>
  <text class="vr-desc" x="496" y="132">finding against the code.</text>

  <!-- 04 you comment (left, row 2) -->
  <rect class="vr-box" x="20" y="190" width="380" height="120" rx="12"/>
  <rect class="vr-chip" x="36" y="206" width="36" height="36" rx="8"/>
  <g class="vr-icn" transform="translate(44, 214) scale(0.8333)">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </g>
  <text class="vr-num" x="384" y="220" text-anchor="end">04</text>
  <text class="vr-title" x="36" y="266">You comment</text>
  <text class="vr-desc" x="36" y="286">One comment box per finding,</text>
  <text class="vr-desc" x="36" y="302">autosaved as you type.</text>

  <!-- 03 the page (right, row 2, with mini screen) -->
  <rect class="vr-box" x="480" y="190" width="380" height="120" rx="12"/>
  <rect class="vr-chip" x="496" y="206" width="36" height="36" rx="8"/>
  <g class="vr-icn" transform="translate(504, 214) scale(0.8333)">
    <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>
  </g>
  <text class="vr-num" x="844" y="220" text-anchor="end">03</text>
  <text class="vr-title" x="496" y="266">The page</text>
  <text class="vr-desc" x="496" y="286">Verdict first, then one finding</text>
  <text class="vr-desc" x="496" y="302">per screen, with its code.</text>
  <rect class="vr-mock" x="700" y="210" width="120" height="84" rx="6"/>
  <line class="vr-sep" x1="700" y1="222" x2="820" y2="222"/>
  <circle class="vr-dot" cx="708" cy="216" r="1.8"/>
  <circle class="vr-dot" cx="716" cy="216" r="1.8"/>
  <circle class="vr-dot" cx="724" cy="216" r="1.8"/>
  <rect class="vr-pill" x="710" y="230" width="42" height="8" rx="4"/>
  <circle class="vr-dot" cx="714" cy="252" r="2.5"/>
  <rect class="vr-stub" x="722" y="249.5" width="58" height="5" rx="2.5"/>
  <rect class="vr-comment" x="710" y="264" width="100" height="22" rx="5"/>
  <line class="vr-caret" x1="718" y1="278" x2="718" y2="270"/>

  <!-- 05 agent acts (left, row 3) -->
  <rect class="vr-box" x="20" y="360" width="380" height="120" rx="12"/>
  <rect class="vr-chip" x="36" y="376" width="36" height="36" rx="8"/>
  <g class="vr-icn" transform="translate(44, 384) scale(0.8333)">
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
  </g>
  <text class="vr-num" x="384" y="390" text-anchor="end">05</text>
  <text class="vr-title" x="36" y="436">Agent acts</text>
  <text class="vr-desc" x="36" y="456">Your comments become the</text>
  <text class="vr-desc" x="36" y="472">instructions for the fix.</text>

  <!-- note: local only (right, row 3) -->
  <rect class="vr-note" x="480" y="360" width="380" height="120" rx="12"/>
  <rect class="vr-chip" x="496" y="376" width="36" height="36" rx="8"/>
  <g class="vr-icn" transform="translate(504, 384) scale(0.8333)">
    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  </g>
  <text class="vr-title" x="496" y="436">Local only</text>
  <text class="vr-desc" x="496" y="456">Nothing goes to GitHub</text>
  <text class="vr-desc" x="496" y="472">until you approve it.</text>
</svg>
